<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NeoAGA Lab</title>
<style>
body {
    margin:0;
    overflow:hidden;
    background:black;
}
canvas {
    width:100vw;
    height:100vh;
    display:block;
}
</style>
</head>
<body>
<canvas id="gfx"></canvas>

<script type="module">
async function start() {

    if (!navigator.gpu) {
        document.body.innerHTML =
            "<h1>WebGPU nem támogatott</h1>";
        return;
    }

    const canvas =
        document.getElementById("gfx");

    const adapter =
        await navigator.gpu.requestAdapter();

    const device =
        await adapter.requestDevice();

    const context =
        canvas.getContext("webgpu");

    const format =
        navigator.gpu.getPreferredCanvasFormat();

    context.configure({
        device,
        format,
        alphaMode: "opaque"
    });

    console.log("NeoAGA WebGPU OK");
}

start();
</script>
</body>
</html>
